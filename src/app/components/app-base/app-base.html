<mat-toolbar class="full-width-toolbar">
    <div class="toolbar-left">
        <button mat-icon-button class="hamburger-btn" [matMenuTriggerFor]="menu">
            <mat-icon>menu</mat-icon>
        </button>
        <span class="toolbar-title">MASE</span>
    </div>
    <div class="toolbar-right">
        <button mat-icon-button aria-label="Friends" (click)="rightDrawer.open()">
            <mat-icon class="icon">group</mat-icon>
        </button>
        <button mat-icon-button aria-label="Logout">
            <mat-icon class="icon">logout</mat-icon>
        </button>
    </div>
</mat-toolbar>


<mat-menu #menu="matMenu">
    @for(menuItem of menuItems; track menuItem.label) {
    <button mat-menu-item (click)="menuItem.action ? menuItem.action() : null"
        [routerLink]="menuItem.route ? menuItem.route : null">
        <mat-icon>{{menuItem.icon}}</mat-icon>
        <span>{{menuItem.label}}</span>
    </button>
    }
</mat-menu>

<mat-drawer-container>
    <mat-drawer-container class="full-height">
        <mat-drawer #rightDrawer mode="over" position="end">
            <div class="drawer-header">
                <h3>Groups</h3>
                <button mat-icon-button aria-label="Close drawer" (click)="rightDrawer.close()">
                    <mat-icon>close</mat-icon>
                </button>
            </div>
            <div class="drawer-body">
                <!-- group content goes here -->
                Right drawer
            </div>
        </mat-drawer>
        <mat-drawer-content>
            Main content
        </mat-drawer-content>
    </mat-drawer-container>
</mat-drawer-container>


<router-outlet></router-outlet>
